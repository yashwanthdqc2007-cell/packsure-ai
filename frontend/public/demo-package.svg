<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="url(#bgGrad)" />
  <rect width="600" height="700" fill="url(#grid)" />

  <!-- Package Outer Contour -->
  <g transform="translate(100, 60)">
    <!-- Package shadow -->
    <rect x="8" y="12" width="384" height="550" rx="16" fill="#000000" opacity="0.15" filter="blur(8px)" />

    <!-- Package Body -->
    <rect x="0" y="0" width="400" height="560" rx="14" fill="url(#packGrad)" stroke="#334155" stroke-width="2" />

    <!-- Top Seal Crimping -->
    <path d="M 0 24 L 400 24" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2" />
    <path d="M 0 30 L 400 30" stroke="#334155" stroke-width="1" />

    <!-- Header Brand Accent -->
    <rect x="30" y="50" width="340" height="6" rx="3" fill="url(#goldGrad)" />

    <!-- Brand & Commodity Title -->
    <text x="200" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2">PREMIUM QUALITY COMMODITY</text>
    <text x="200" y="122" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">GOLDEN HARVEST</text>
    <text x="200" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F59E0B">TRADITIONAL BASMATI RICE</text>

    <!-- Visual Divider -->
    <line x1="40" y1="170" x2="360" y2="170" stroke="#334155" stroke-width="1" />

    <!-- Mandatory Declarations Panel (White Background) -->
    <rect x="30" y="190" width="340" height="290" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Panel Header -->
    <rect x="30" y="190" width="340" height="28" rx="8" fill="#F1F5F9" />
    <text x="44" y="209" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" fill="#334155" letter-spacing="1">MANDATORY DECLARATIONS (PCR 2011)</text>

    <!-- Declaration Fields -->
    <!-- Net Quantity -->
    <g transform="translate(44, 240)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">NET QUANTITY</text>
      <text x="0" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">5 kg</text>
      <rect x="230" y="-8" width="60" height="26" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="260" y="9" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669">Rule 12 OK</text>
    </g>

    <!-- Maximum Retail Price (MRP) -->
    <g transform="translate(44, 285)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">MAXIMUM RETAIL PRICE</text>
      <text x="0" y="16" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">₹ 495.00</text>
      <text x="75" y="16" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#64748B">(Incl. of all taxes)</text>
    </g>

    <!-- Month & Year of Manufacture / Packing -->
    <g transform="translate(44, 330)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">MONTH &amp; YEAR OF PACKING</text>
      <text x="0" y="16" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">08 / 2026</text>
    </g>

    <!-- Manufacturer Details -->
    <g transform="translate(44, 372)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">PACKED &amp; MARKETED BY</text>
      <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Harvest Agro Foods India Pvt. Ltd.</text>
      <text x="0" y="27" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#64748B">Plot 42, Sector 8, Industrial Area, New Delhi 110020</text>
    </g>

    <!-- Consumer Care -->
    <g transform="translate(44, 422)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">CONSUMER CARE HELPLINE</text>
      <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">1800-200-4820 | care@harvestagro.in</text>
    </g>

    <!-- Bottom Barcode & Standards Icon -->
    <g transform="translate(44, 498)">
      <!-- Mock Barcode Lines -->
      <line x1="0" y1="0" x2="0" y2="35" stroke="#1E293B" stroke-width="2.5" />
      <line x1="5" y1="0" x2="5" y2="35" stroke="#1E293B" stroke-width="1.5" />
      <line x1="9" y1="0" x2="9" y2="35" stroke="#1E293B" stroke-width="3" />
      <line x1="15" y1="0" x2="15" y2="35" stroke="#1E293B" stroke-width="1" />
      <line x1="19" y1="0" x2="19" y2="35" stroke="#1E293B" stroke-width="4" />
      <line x1="26" y1="0" x2="26" y2="35" stroke="#1E293B" stroke-width="1.5" />
      <line x1="31" y1="0" x2="31" y2="35" stroke="#1E293B" stroke-width="2" />
      <line x1="36" y1="0" x2="36" y2="35" stroke="#1E293B" stroke-width="3.5" />
      <line x1="43" y1="0" x2="43" y2="35" stroke="#1E293B" stroke-width="1" />
      <line x1="48" y1="0" x2="48" y2="35" stroke="#1E293B" stroke-width="2.5" />
      <line x1="54" y1="0" x2="54" y2="35" stroke="#1E293B" stroke-width="3" />
      <line x1="61" y1="0" x2="61" y2="35" stroke="#1E293B" stroke-width="1.5" />
      <line x1="66" y1="0" x2="66" y2="35" stroke="#1E293B" stroke-width="3" />
      <line x1="72" y1="0" x2="72" y2="35" stroke="#1E293B" stroke-width="1" />
      <line x1="76" y1="0" x2="76" y2="35" stroke="#1E293B" stroke-width="2.5" />
      <line x1="82" y1="0" x2="82" y2="35" stroke="#1E293B" stroke-width="4" />
      <line x1="90" y1="0" x2="90" y2="35" stroke="#1E293B" stroke-width="1.5" />
      <line x1="95" y1="0" x2="95" y2="35" stroke="#1E293B" stroke-width="2" />
      <line x1="100" y1="0" x2="100" y2="35" stroke="#1E293B" stroke-width="3" />
      <text x="50" y="47" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">8901234567890</text>

      <!-- Veg Mark & FSSAI Placeholder -->
      <rect x="230" y="2" width="22" height="22" rx="2" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" />
      <circle cx="241" cy="13" r="6" fill="#16A34A" />
      <text x="260" y="16" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#94A3B8">VEG</text>
    </g>
  </g>

  <!-- Inspection Evidence Frame HUD Lines & Reticle -->
  <g stroke="#2563EB" stroke-width="1.5" opacity="0.6">
    <path d="M 80 40 L 60 40 L 60 60" fill="none" />
    <path d="M 520 40 L 540 40 L 540 60" fill="none" />
    <path d="M 80 640 L 60 640 L 60 620" fill="none" />
    <path d="M 520 640 L 540 640 L 540 620" fill="none" />
  </g>
</svg>
